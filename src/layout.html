<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.fullTitle}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{page.robots}}">
<meta name="theme-color" content="{{site.theme.primary}}">
<link rel="canonical" href="{{page.url}}">
<link rel="icon" href="{{brand.favicon}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="cs_CZ">
<meta property="og:site_name" content="{{brand.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{brand.name}} – {{brand.tagline}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{page.ogImage}}">
{{@verification}}
<link rel="preload" href="/assets/fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
{{@fontLink}}
<link rel="stylesheet" href="/css/theme.css?v={{ver}}">
<link rel="stylesheet" href="/css/style.css?v={{ver}}">
{{@analytics}}
{{@jsonld}}
</head>
<body>
<a class="skip" href="#obsah">Přeskočit na obsah</a>
{{> header}}
<main id="obsah">
{{{content}}}
</main>
{{> footer}}
{{@cookieBanner}}
<script src="/js/main.js?v={{ver}}" defer></script>
</body>
</html>
